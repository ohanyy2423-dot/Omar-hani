<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو الأصوات الذكي</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #34495e; padding: 25px; border-radius: 20px; }
        textarea { width: 100%; height: 120px; border-radius: 10px; padding: 10px; margin-top: 10px; }
        button { background: #27ae60; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>نظام اختيار الأصوات الذكي</h2>
        <textarea id="storyInput" placeholder="اكتب القصة هنا... (مثلاً: كان هناك طفل صغير يركض، أو امرأة حكيمة تتحدث)"></textarea>
        <button onclick="playSmartVoice()">إنتاج الصوت (رجالي/أنثوي/طفولي)</button>
    </div>

    <script>
        function playSmartVoice() {
            const text = document.getElementById('storyInput').value;
            const voices = window.speechSynthesis.getVoices();
            
            // محرك ذكي لاختيار الصوت
            let selectedVoice;
            let pitch = 1.0; // الطبقة الافتراضية
            let rate = 1.0;  // السرعة

            if (text.includes('طفل') || text.includes('ولد') || text.includes('بنت')) {
                // صوت طفولي: سرعة أعلى وطبقة صوت حادة
                pitch = 1.5; 
                rate = 1.2;
            } else if (text.includes('امرأة') || text.includes('فتاة') || text.includes('أنثى')) {
                // صوت أنثوي: طبقة أعلى قليلاً
                pitch = 1.2;
            } else {
                // صوت رجالي افتراضي
                pitch = 0.8;
            }

            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ar-SA';
            speech.pitch = pitch;
            speech.rate = rate;

            // اختيار الصوت من قائمة أصوات المتصفح المتاحة
            speech.voice = voices.find(v => v.lang === 'ar-SA') || voices[0];
            
            window.speechSynthesis.speak(speech);
        }

        // تحميل الأصوات عند فتح الصفحة
        window.speechSynthesis.onvoiceschanged = () => {
            console.log("تم تحميل الأصوات بنجاح");
        };
    </script>
</body>
</html>

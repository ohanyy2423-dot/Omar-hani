<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صانع قصص العائلة بالذكاء الاصطناعي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #121212;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            text-align: right;
            background: #252525;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #3498db;
        }
        input[type="file"], textarea, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background: #c0392b;
        }
        canvas {
            border: 2px solid #444;
            background: #000;
            max-width: 100%;
            border-radius: 6px;
            margin-top: 15px;
        }
        #downloadLink {
            display: none;
            margin-top: 15px;
            background: #27ae60;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>صانع قصص وأصوات العائلة</h2>
        
        <div class="section">
            <label>1. صور المشاهد (اختياري):</label>
            <input type="file" id="uploadImages" multiple accept="image/*">
        </div>

        <div class="section">
            <label>2. اختر شخصية المتحدث (العائلة):</label>
            <select id="familyRole">
                <option value="father">الأب (صوت عميق وخشين)</option>
                <option value="mother">الأم (صوت هادئ ودافئ)</option>
                <option value="child">الطفل/الابن (صوت حاد ورفيع)</option>
            </select>
        </div>

        <div class="section">
            <label>3. اكتب حوار الشخصية:</label>
            <textarea id="storyText" placeholder="اكتب ما تنطقه هذه الشخصية..."></textarea>
        </div>

        <button onclick="startFamilyRecording()">تسجيل وإنشاء فيديو العائلة</button>
        
        <a id="downloadLink" download="family-video.webm">تحميل الفيديو الناتج</a>
        <br>
        <canvas id="videoCanvas" width="640" height="360"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');

        function startFamilyRecording() {
            const imageFiles = document.getElementById('uploadImages').files;
            const textVal = document.getElementById('storyText').value;
            const familyRole = document.getElementById('familyRole').value;
            const downloadLink = document.getElementById('downloadLink');

            if (!textVal.trim()) {
                alert('الرجاء كتابة الحوار أولاً!');
                return;
            }

            const stream = canvas.captureStream(30);
            let recorder;
            try {
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            } catch (e) {
                alert('متصفحك لا يدعم التسجيل المباشر.');
                return;
            }

            let chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const videoUrl = URL.createObjectURL(blob);
                downloadLink.href = videoUrl;
                downloadLink.style.display = 'block';
                downloadLink.innerText = 'اضغط هنا لتحميل فيديو العائلة!';
                alert('تم تسجيل الفيديو بنجاح!');
            };

            recorder.start();

            // ضبط نبرة الصوت خصيصاً لكل فرد من العائلة
            const speech = new SpeechSynthesisUtterance(textVal);
            speech.lang = 'ar-SA';
            
            if (familyRole === 'father') {
                speech.pitch = 0.6; // صوت أب عميق جداً
                speech.rate = 0.9;  // هادئ ومتأني
            } else if (familyRole === 'mother') {
                speech.pitch = 1.2; // صوت أم دافئ
                speech.rate = 1.0;
            } else if (familyRole === 'child') {
                speech.pitch = 1.7; // صوت طفل رفيع وحيوي
                speech.rate = 1.25; // سريع بعض الشيء
            }

            window.speechSynthesis.speak(speech);

            let imagesArray = [];
            for (let i = 0; i < imageFiles.length; i++) {
                imagesArray.push(imageFiles[i]);
            }

            let index = 0;
            function drawFrame() {
                if (imagesArray.length === 0) {
                    ctx.fillStyle = '#111';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#3498db';
                    ctx.font = '22px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('حوار عائلي: ' + familyRole, canvas.width / 2, 180);
                    
                    setTimeout(() => {
                        recorder.stop();
                    }, 4000);
                    return;
                }

                if (index >= imagesArray.length) {
                    setTimeout(() => {
                        recorder.stop();
                    }, 2000);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        index++;
                        setTimeout(drawFrame, 2000);
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(imagesArray[index]);
            }

            drawFrame();
        }
    </script>
</body>
</html>
